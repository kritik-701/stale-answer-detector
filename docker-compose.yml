services:
  bifrost:
    image: maximhq/bifrost
    ports: ["8080:8080"]
    volumes: ["./bifrost-data:/app/data"]
  detector:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      BIFROST_URL: http://bifrost:8080
      DB_PATH: /data/checks.db
    volumes: ["./data:/data"]
    depends_on: [bifrost]
