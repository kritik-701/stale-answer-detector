<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stale-Answer Detector · Bifrost + Tavily</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
<div class="max-w-6xl mx-auto p-4 sm:p-6">
  <header class="flex flex-wrap items-center justify-between gap-2 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-white">Stale-Answer Detector</h1>
      <p class="text-sm text-slate-400">LLM answers verified against live web sources · Bifrost gateway + Tavily</p>
    </div>
    <span id="status" class="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400">connecting…</span>
  </header>

  <section id="metrics" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6"></section>

  <section class="grid md:grid-cols-3 gap-4 mb-6">
    <div class="md:col-span-2 bg-slate-900 rounded-xl p-4 border border-slate-800">
      <h2 class="font-semibold text-white mb-2">Try it: paste an LLM answer</h2>
      <input id="question" class="w-full mb-2 rounded bg-slate-800 border border-slate-700 p-2 text-sm" placeholder="Original question (optional)">
      <textarea id="answer" rows="4" class="w-full rounded bg-slate-800 border border-slate-700 p-2 text-sm"
        placeholder="e.g. The CEO of Twitter is Jack Dorsey. GPT-4 costs $0.03 per 1K input tokens."></textarea>
      <div class="flex items-center gap-3 mt-2">
        <button id="go" class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 px-4 py-2 rounded text-sm font-medium text-white">Verify freshness</button>
        <span id="msg" class="text-sm text-slate-400"></span>
      </div>
    </div>
    <div class="bg-slate-900 rounded-xl p-4 border border-slate-800">
      <h2 class="font-semibold text-white mb-2">Claims by category</h2>
      <div id="cats" class="space-y-2 text-sm"></div>
      <h2 class="font-semibold text-white mt-4 mb-2">Top live sources</h2>
      <ul id="domains" class="text-sm text-slate-400 space-y-1"></ul>
    </div>
  </section>

  <section class="bg-slate-900 rounded-xl border border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
      <h2 class="font-semibold text-white">Live log</h2>
      <label class="text-sm text-slate-400"><input type="checkbox" id="onlyStale" class="mr-1">stale only</label>
    </div>
    <div id="logs" class="divide-y divide-slate-800"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";
const color = (n) => n >= 70 ? "text-emerald-400" : n >= 40 ? "text-amber-400" : "text-rose-400";
const badge = (v) => ({current:"bg-emerald-900 text-emerald-300", outdated:"bg-rose-900 text-rose-300"}[v] || "bg-slate-700 text-slate-300");
const open = new Set();
let logs = [];

function card(label, value, cls = "text-white") {
  return `<div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><div class="text-xs text-slate-400">${esc(label)}</div><div class="text-2xl font-bold ${cls}">${esc(value)}</div></div>`;
}

function renderMetrics(m) {
  $("metrics").innerHTML =
    card("Answers checked", m.total_checks) +
    card("Stale answers", m.stale_answers, "text-rose-400") +
    card("Stale rate", m.stale_rate + "%", "text-amber-400") +
    card("Avg freshness", m.avg_score, color(m.avg_score)) +
    card("Avg latency", m.avg_latency_ms + " ms");
  const total = Object.values(m.by_category).reduce((a, b) => a + b, 0) || 1;
  $("cats").innerHTML = Object.entries(m.by_category).map(([k, v]) =>
    `<div><div class="flex justify-between"><span>${esc(k)}</span><span>${v}</span></div>
     <div class="h-2 bg-slate-800 rounded"><div class="h-2 bg-indigo-500 rounded" style="width:${Math.round(100 * v / total)}%"></div></div></div>`).join("") ||
    '<div class="text-slate-500">No data yet</div>';
  $("domains").innerHTML = m.top_sources.map(([d, n]) => `<li>${esc(d)} <span class="text-slate-600">×${n}</span></li>`).join("") ||
    '<li class="text-slate-500">No data yet</li>';
}

function renderLogs() {
  const rows = logs.filter((l) => !$("onlyStale").checked || l.is_stale);
  $("logs").innerHTML = rows.map((l) => {
    const r = l.report;
    const detail = open.has(l.id) ? r.claims.map((c) => `
      <div class="mt-3 p-3 rounded bg-slate-800/60">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs px-2 py-0.5 rounded ${badge(c.verdict)}">${esc(c.verdict)}</span>
          <span class="text-xs text-slate-400">${esc(c.category)}</span>
          <span class="text-xs font-bold ${color(c.freshness)}">freshness ${c.freshness}</span>
        </div>
        <p class="mt-1 text-sm text-white">${esc(c.text)}</p>
        ${c.corrected_fact ? `<p class="mt-1 text-sm text-emerald-300">Current: ${esc(c.corrected_fact)}</p>` : ""}
        <p class="mt-1 text-xs text-slate-400">${esc(c.reasoning)}</p>
        <ul class="mt-2 text-xs space-y-1">${c.sources.map((s) =>
          `<li><a class="text-indigo-400 hover:underline" target="_blank" rel="noopener noreferrer" href="${esc(safeUrl(s.url))}">${esc(s.title || s.url)}</a></li>`).join("")}</ul>
      </div>`).join("") + (r.used_fallback ? '<p class="mt-2 text-xs text-amber-400">LLM extraction failed; heuristic fallback used.</p>' : "") : "";
    return `<div class="p-4 cursor-pointer hover:bg-slate-800/40" data-id="${l.id}">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div class="text-sm text-white truncate">${esc(l.question || l.answer)}</div>
          <div class="text-xs text-slate-500">${esc(l.created_at)} · ${esc(l.source)} · ${l.latency_ms} ms · ${esc(l.summary)}</div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-xl font-bold ${color(l.score)}">${l.score}</div>
          <div class="text-xs ${l.is_stale ? "text-rose-400" : "text-emerald-400"}">${l.is_stale ? "STALE" : "OK"}</div>
        </div>
      </div>${detail}</div>`;
  }).join("") || '<div class="p-6 text-slate-500 text-sm">No checks yet. Paste an answer above or send traffic through the proxy.</div>';
}

$("logs").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const row = e.target.closest("[data-id]");
  if (!row) return;
  const id = Number(row.dataset.id);
  open.has(id) ? open.delete(id) : open.add(id);
  renderLogs();
});
$("onlyStale").addEventListener("change", renderLogs);

async function refresh() {
  try {
    const [m, l] = await Promise.all([fetch("/api/metrics").then((r) => r.json()), fetch("/api/logs?limit=50").then((r) => r.json())]);
    logs = l; renderMetrics(m); renderLogs();
    $("status").textContent = "live"; $("status").className = "text-xs px-3 py-1 rounded-full bg-emerald-900 text-emerald-300";
  } catch (e) {
    $("status").textContent = "offline"; $("status").className = "text-xs px-3 py-1 rounded-full bg-rose-900 text-rose-300";
  }
}

$("go").addEventListener("click", async () => {
  const answer = $("answer").value.trim();
  if (!answer) { $("msg").textContent = "Paste an answer first."; return; }
  $("go").disabled = true; $("msg").textContent = "Searching the live web…";
  try {
    const r = await fetch("/v1/verify", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer, question: $("question").value }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    open.add(d.id);
    $("msg").textContent = `Done: ${d.summary} (score ${d.score})`;
    await refresh();
  } catch (e) { $("msg").textContent = "Failed: " + e.message; }
  $("go").disabled = false;
});

refresh(); setInterval(refresh, 4000);
</script>
</body>
</html>
